name: Build CSS from Design Tokens

on:
  push:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - 'data/**'
      - 'tokens/**'
      - 'src/config.json'
      - 'package.json'
  pull_request:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - 'data/**'
      - 'tokens/**'
      - 'src/config.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-css:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS files with Style Dictionary
        run: npm run build

      - name: Verify CSS files were generated
        run: |
          if [ ! -f "build/css/light.css" ] || [ ! -f "build/css/dark.css" ]; then
            echo "Error: CSS files were not generated"
            exit 1
          fi
          echo "✓ CSS files generated successfully"
          ls -lh build/css/

      - name: Commit CSS files if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add build/css/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-generate CSS files from design tokens"
            git push
          fi

      - name: Upload CSS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: css-files
          path: build/css/
          retention-days: 30

